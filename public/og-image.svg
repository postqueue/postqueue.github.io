<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010736" />
      <stop offset="60%" stop-color="#0D1C42" />
      <stop offset="100%" stop-color="#22396F" />
    </linearGradient>
    <linearGradient id="cream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCF1D0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1C42" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#010736" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="150" r="280" fill="#22396F" fill-opacity="0.25" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="300" fill="#0D1C42" fill-opacity="0.3" filter="blur(100px)" />

  <!-- Brand Pill -->
  <g transform="translate(100, 100)">
    <rect width="230" height="44" rx="22" fill="#0D1C42" stroke="#22396F" stroke-width="1.5" />
    <circle cx="22" cy="22" r="6" fill="#FCF1D0" />
    <text x="38" y="27" fill="#FCF1D0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">100% CLIENT-SIDE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="220" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Post<tspan fill="url(#cream-grad)">Queue</tspan>
  </text>
  <text x="100" y="285" fill="#FCF1D0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
    Free 30-Day Content Creator Planner
  </text>
  <text x="100" y="340" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
    Plan, organize, and store video hooks, raw file titles, captions &amp; hashtags locally.
  </text>

  <!-- Feature Pillars -->
  <g transform="translate(100, 420)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="300" height="110" rx="16" fill="url(#card-grad)" stroke="#22396F" stroke-width="1.5" />
    <text x="24" y="44" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="22">💡 Idea ➔ 🎬 Filmed</text>
    <text x="24" y="78" fill="#FCF1D0" font-family="system-ui, sans-serif" font-size="14">3-Stage Visual Pipeline</text>

    <!-- Pillar 2 -->
    <rect x="330" y="0" width="300" height="110" rx="16" fill="url(#card-grad)" stroke="#22396F" stroke-width="1.5" />
    <text x="354" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="22">📋 1-Click Copy Package</text>
    <text x="354" y="78" fill="#FCF1D0" font-family="system-ui, sans-serif" font-size="14">Hook + Caption + Hashtags</text>

    <!-- Pillar 3 -->
    <rect x="660" y="0" width="340" height="110" rx="16" fill="url(#card-grad)" stroke="#22396F" stroke-width="1.5" />
    <text x="684" y="44" fill="#FCF1D0" font-family="system-ui, sans-serif" font-size="22">🔒 Zero-Server Storage</text>
    <text x="684" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Browser LocalStorage • 100% Private</text>
  </g>

  <!-- Bottom Attribution -->
  <text x="100" y="585" fill="#FCF1D0" opacity="0.6" font-family="system-ui, sans-serif" font-size="15" font-weight="500">
    https://postqueue.github.io • TikTok, Reels &amp; YouTube Shorts
  </text>
</svg>
